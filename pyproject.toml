[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsys-llm-explainer"
version = "0.3.1"
description = "Offline Nsight Systems (SQLite) explainer for LLM inference hotspots"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fahad Alghanim" }]
keywords = ["nsys", "nsight", "sqlite", "cuda", "llm", "vllm", "profiling", "performance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "dash>=2.17.0",
  "plotly>=5.22.0",
  "pandas>=1.5.0",
]

[project.optional-dependencies]
pandas = ["pandas"]
dev = ["pytest"]
api = [
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]
client = ["requests>=2.31.0"]
spaces = ["gradio>=4.44.0"]

[project.scripts]
nsys-llm-explain = "nsys_llm_explainer.cli:main"
nsys-llm-api = "nsys_llm_explainer.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
